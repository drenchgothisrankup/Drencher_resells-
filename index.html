<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Storefront</title>
    <style>
        /* Minimalist Reset & Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        header {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid #eaeaea;
        }

        /* Bold, clean logo design */
        .brand-logo {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .container {
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        /* Sidebar Navigation */
        nav {
            width: 100%;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            nav {
                width: 200px;
                flex-shrink: 0;
            }
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            margin-bottom: 10px;
        }

        nav ul li a {
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Product Grid */
        .product-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .product-card {
            text-align: center;
            border: 1px solid #transparent;
        }

        .product-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .product-info {
            padding: 8px 0;
            font-size: 13px;
            text-align: left;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .product-price {
            color: #666666;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo">YOUR BRAND</a>
    </header>

    <div class="container">
        <nav>
            <ul>
                <li><a href="#">New</a></li>
                <li><a href="#">Jackets</a></li>
                <li><a href="#">Shirts</a></li>
                <li><a href="#">T-Shirts</a></li>
                <li><a href="#">Hats</a></li>
                <li><a href="#">Accessories</a></li>
            </ul>
        </nav>

        <main class="product-grid">
            <!-- Product Item 1 -->
            <div class="product-card">
                <img src="https://placeholder.com" alt="Product 1">
                <div class="product-info">
                    <div class="product-name">Item Name One</div>
                    <div class="product-price">$48</div>
                </div>
            </div>

            <!-- Product Item 2 -->
            <div class="product-card">
                <img src="https://placeholder.com" alt="Product 2">
                <div class="product-info">
                    <div class="product-name">Item Name Two</div>
                    <div class="product-price">$110</div>
                </div>
            </div>

            <!-- Product Item 3 -->
            <div class="product-card">
                <img src="https://placeholder.com" alt="Product 3">
                <div class="product-info">
                    <div class="product-name">Item Name Three</div>
                    <div class="product-price">$36</div>
                </div>
            </div>

            <!-- Product Item 4 -->
            <div class="product-card">
                <img src="https://placeholder.com" alt="Product 4">
                <div class="product-info">
                    <div class="product-name">Item Name Four</div>
                    <div class="product-price">$148</div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
