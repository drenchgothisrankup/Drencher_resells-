<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRENCHER_RESELLSS</title>
    <style>
        /* Base Styles matching your clean layout */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            scroll-behavior: smooth;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
        }

        .brand-title {
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            text-decoration: none;
            color: #000000;
            text-transform: uppercase;
        }

        .header-links a {
            color: #000000;
            text-decoration: none;
            margin-right: 25px;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .cart-toggle-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-badge {
            background: #ff0000;
            color: #ffffff;
            font-size: 11px;
            border-radius: 50%;
            padding: 2px 6px;
        }

        /* Hero Main Section Banner */
        .hero-banner {
            text-align: center;
            padding: 100px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        .hero-banner h1 {
            font-size: 38px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 15px 0;
        }

        .hero-banner p {
            color: #666666;
            font-size: 16px;
            margin: 0 0 35px 0;
            letter-spacing: 1px;
        }

        .shop-now-btn {
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 40px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
        }

        /* Store Catalog Wrapper */
        .store-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-headline {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 40px 0 30px 0;
            font-weight: bold;
        }

        .category-block {
            margin-bottom: 50px;
        }

        .category-headline {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .category-subtext {
            font-size: 14px;
            color: #666666;
            margin: 0 0 20px 0;
        }

        /* Dynamic Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }

        .product-card {
            border: 1px solid #eeeeee;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .product-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #fcfcfc;
        }

        .product-details {
            padding-top: 15px;
            font-size: 14px;
        }

        .product-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .product-price {
            color: #000000;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .shipping-dropdown {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            border: 1px solid #cccccc;
            background: #ffffff;
        }

        .add-to-cart-action {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 0;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .add-to-cart-action:hover {
            background: #333333;
        }

        /* Shopping Cart Right Drawer Panel */
        .cart-drawer-panel {
            position: fixed;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100%;
            background: #ffffff;
            box-shadow: -3px 0 10px rgba(0,0,0,0.1);
            z-index: 250;
            transition: right 0.3s ease;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .cart-drawer-panel.active {
            right: 0;
        }

        .close-cart-btn {
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
            float: right;
            line-height: 1;
        }

        .cart-items-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 25px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 12px;
            font-size: 14px;
        }

        .remove-item-btn {
            background: none;
            border: none;
            color: #ff0000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        .checkout-now-btn {
            width: 100%;
            background: #e60000;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Payment Form Secure Overlay Modal */
        .payment-modal-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 300;
            display: none;
            box-sizing: border-box;
        }

        .payment-modal-screen.active {
            display: block;
        }

        .apple-pay-btn-element {
            background: #000000;
            color: #ffffff;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-input-block {
            margin-bottom: 14px;
        }

        .form-input-block label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-input-block input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            box-sizing: border-box;
            background: #ffffff;
        }

        .submit-payment-action {
            width: 100%;
            background: #000000;
            color: #ffffff;
            padding: 12px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Business Contact Footer */
        footer {
            margin-top: 100px;
            padding: 60px 40px;
            background: #ffffff;
            border-top: 1px solid #eaeaea;
            font-size: 15px;
            line-height: 1.8;
        }

        .footer-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        footer h2 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 20px 0;
            font-weight: bold;
        }

        footer p {
            margin: 8px 0;
        }

        footer a {
            color: #000000;
            font-weight: bold;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Click Background Dark Mask overlay */
        .background-click-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 150;
            display: none;
        }
