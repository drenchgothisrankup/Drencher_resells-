<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRENCHER RESELLS</title>
    <style>
        /* Base Page Setup */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            scroll-behavior: smooth;
        }

        /* Top Header Bar Layout */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 100;
        }

        .brand-title {
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            text-decoration: none;
            color: #000000;
            text-transform: uppercase;
        }

        nav a {
            color: #000000;
            text-decoration: none;
            margin-right: 25px;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .cart-toggle-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-badge {
            background: #ff0000;
            color: #ffffff;
            font-size: 11px;
            border-radius: 50%;
            padding: 2px 6px;
        }

        /* Hero Splash Banner layout */
        .hero-banner {
            text-align: center;
            padding: 80px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
        }

        .hero-banner h1 {
            font-size: 36px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .hero-banner p {
            color: #666666;
            font-size: 15px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .shop-now-btn {
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 35px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
        }

        /* Main Workspace Framework */
        .main-content {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 50px 0 25px 0;
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
            font-weight: bold;
        }

        .subsection-header {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 30px 0 15px 0;
            color: #333333;
            border-left: 3px solid #000000;
            padding-left: 10px;
        }

        /* Item Grid Framework */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .item-card {
            border: 1px solid #eeeeee;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .item-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background-color: #fcfcfc;
        }

        .item-details {
            padding-top: 15px;
            font-size: 14px;
        }

        .item-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .item-price {
            color: #000000;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .shipping-dropdown {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            border: 1px solid #cccccc;
            background: #ffffff;
        }

        .buy-action-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 0;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .buy-action-btn:hover {
            background: #333333;
        }

        /* Slide-out Drawer Cart Panel */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100%;
            background: #ffffff;
            box-shadow: -3px 0 10px rgba(0,0,0,0.1);
            z-index: 250;
            transition: right 0.3s ease;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .cart-drawer.active {
            right: 0;
        }

        .close-drawer-btn {
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
            float: right;
            line-height: 1;
        }

        .cart-items-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 25px;
        }

        .cart-product-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 12px;
            font-size: 14px;
        }

        .remove-row-btn {
            background: none;
            border: none;
            color: #ff0000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        .checkout-trigger-btn {
            width: 100%;
            background: #e60000;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Payment Terminal Screen Pop-up */
        .checkout-terminal-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 300;
            display: none;
            box-sizing: border-box;
        }

        .checkout-terminal-modal.active {
            display: block;
        }

        .apple-pay-element {
            background: #000000;
            color: #ffffff;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-block {
            margin-bottom: 14px;
        }

        .input-block label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .input-block input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            box-sizing: border-box;
            background: #ffffff;
        }

        .execute-checkout-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            padding: 12px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Contact Details section footer layout */
        footer {
            margin-top: 100px;
            padding: 60px 40px;
            background: #ffffff;
            border-top: 1px solid #eaeaea;
            font-size: 14px;
        }

        .footer-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        footer h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        footer p {
            margin: 8px 0;
            color: #333333;
        }

        footer a {
            color: #000000;
            font-weight: bold;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Screen Click Mask background overlay */
        .click-mask-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 150;
            display: none;
        }

        .click-mask-overlay.active {
            display: block;
        }
    </style>
</head>
<body>
