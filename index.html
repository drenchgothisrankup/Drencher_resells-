<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRENCHER_RESELLSS</title>
    <style>
        /* Base Minimalism Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            scroll-behavior: smooth;
        }

        /* Top Header Area */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        .brand-logo {
            background-color: #000000;
            color: #ffffff;
            padding: 8px 15px;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }

        nav a {
            color: #000000;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .cart-icon-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            letter-spacing: 1px;
        }

        .cart-count {
            background: red;
            color: white;
            font-size: 11px;
            border-radius: 50%;
            padding: 2px 6px;
            margin-left: 5px;
        }

        /* Hero Splash Banner Section */
        .hero-banner {
            background-color: #f7f7f7;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 1px solid #eaeaea;
        }

        .hero-banner h1 {
            font-size: 32px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hero-banner p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .hero-btn {
            background: #000;
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Website Layout Content */
        .main-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 40px 0 20px 0;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }

        /* Grid Framework for Stock Display */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            border: 1px solid #eee;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .product-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #f7f7f7;
        }

        .product-info {
            padding: 15px 0 0 0;
            font-size: 14px;
        }

        .product-brand {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .product-price {
            color: #000000;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .shipping-select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            border: 1px solid #ccc;
            background: #fff;
        }

        .add-to-cart-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 10px 0;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .add-to-cart-btn:hover {
            background: #333;
        }

        /* Right-Side Sliding Shopping Cart Panel */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100%;
            background: white;
            box-shadow: -3px 0 10px rgba(0,0,0,0.1);
            z-index: 250;
            transition: right 0.3s ease;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .cart-drawer.active {
            right: 0;
        }

        .close-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            float: right;
        }

        .cart-items-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            font-size: 14px;
        }

        .checkout-btn {
            width: 100%;
            background: #e60000;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Integrated Checkout Terminal Overlay Modal */
        .payment-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            <div class="main-container">

            background: white;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 300;
            display: none;
            box-sizing: border-box;
        }

        .payment-modal.active {
            display: block;
        }

        .apple-pay-btn {
            background: #000;
            color: white;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .submit-payment-btn {
            width: 100%;
            background: #000;
            color: white;
            padding: 12px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Modular Footer and Business Info Contacts */
        footer {
            margin-top: 80px;
            padding: 40px 20px;
            background: #fdfdfd;
            border-top: 1px solid #eaeaea;
            font-size: 14px;
            line-height: 1.8;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: left;
        }

        footer a {
            color: #000;
            font-weight: bold;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Interactive Click Masking Layer */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 150;
            display: none;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Dimmer Overlay Layer -->
    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Header Navigation Section -->
    <header>
        <a href="#" class="brand-logo">DRENCHER_RESELLSS</a>
        <nav>
            <a href="#featured">Shop</a>
            <a href="#brands">Brands</a>
            <a href="#contact">Contact</a>
        </nav>
        <button class="cart-icon-btn" onclick="toggleCart()">
            Shopping Cart <span class="cart-count" id="cart-count">0</span>
        </button>
    </header>

    <!-- Hero Promotional Banner -->
    <div class="hero-banner">
        <h1>DESIGNER STREETWEAR</h1>
        <p>Authentic pieces. Clean fits. Resell-ready style.</p>
        <a href="#featured" class="hero-btn">SHOP NOW</a>
    </div>
